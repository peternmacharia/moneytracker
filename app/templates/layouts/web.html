<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Money Tracker</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='web.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <header class="fixed-top">
      <nav class="navbar navbar-expand-lg shadow navbar-light bg-body-tertiary">
        <div class="container">
          <a class="navbar-brand" href="{{ url_for ('index') }}"><img src="{{url_for('static', filename='images/icon.png')}}" class="img-fluid" style="max-width: 50px; max-height: 50px;">Money Tracker</a>
          <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse text-center" id="navbarContent">
            <ul class="navbar-nav nav-underline navlinks ms-auto mb-lg-0 mb-3">
              <li class="nav-item">
                <a class="nav-link {% if ABOUT %}active{% endif %}" href="#about">About Us</a>
              </li>
              <li class="nav-item">
                <a class="nav-link {% if FEATURES %}active{% endif %}" href="#features">Features</a>
              </li>
              <li class="nav-item">
                <a class="nav-link {% if HOWITWORKS %}active{% endif %}" href="#howitworks">How It Works</a>
              </li>
              <li class="nav-item">
                <a class="nav-link {% if FAQ %}active{% endif %}" href="#faq">FAQ</a>
              </li>
              <li class="nav-item">
                <a class="nav-link {% if CONTACT %}active{% endif %}" href="#contact">Contact</a>
              </li>
            </ul>
            {% if current_user.is_authenticated %}
            <ul class="navbar-nav ms-auto gap-2">
              <li class="nav-item">
                <span class="nav-link fw-bold">Welcome, {{ current_user.username }} &nbsp;</span>
              </li>
              <li class="nav-item">
                <a class="btn btn-outline-danger border-0" href="#"><i class="bi bi-power"></i>&nbsp; Logout</a>
              </li>
            </ul>
            {% else %}
            <ul class="navbar-nav ms-auto gap-2">
              <li class="nav-item">
                <a class="btn btn-outline-success border-0" href="#">Login</a>
              </li>
              <li class="nav-item">
                <a class="btn btn-signup text-light" style="background-color: #0f3d5e;" href="#"><span class="fw-bold">Get Started</span></a>
              </li>
            </ul>
            {% endif %}
          </div>
        </div>
      </nav>
    </header>

    <div class="main">
      {% block content %}
      {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='web.js') }}"></script>
  </body>
</html>
